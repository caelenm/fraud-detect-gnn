# Label rule and product filter, reviewed against the real category report
# (outputs/reports/category_values.csv from archives 2-4, May 2018 - Aug 2023).
# A readable summary of how every category is treated, with the reasons, is
# in docs/LABEL_RULE.md.
#
# How this file is checked: the `label` stage refuses to run unless
# `confirmed: true`, every entry below matches at least one complaint, no
# complaint matches more than one of the three lists, and every keyword
# candidate (Issue/Sub-issue mentioning fraud, scams, identity theft,
# unauthorized activity, stolen, ...) inside the target products is listed as
# `positive`, `reviewed_negative` or `excluded`.
#
# Entry format: {product, issue, sub_issue}. Strings must match the data
# exactly (including CFPB's own spelling). "*" (the default for product and
# sub_issue) matches anything; `sub_issue: null` matches only a missing one.
#
# To change the label definition, edit this file and rerun from `label`
# (`uv run run.py --from label --force`). Changing it is a design decision:
# see AGENTS.md.

confirmed: true

# Version 2 (2026-09-29): category-by-category review, decided on the meaning
# of each category only, before looking at any model errors. Changes from
# version 1: "Debt is not yours" and "Impersonated attorney, law enforcement,
# or government official" became positive; ambiguous categories (card-dispute
# handling, unrequested cards, and all former reviewed negatives) are now
# excluded instead of labelled 0.
rule_version: 2

# "Credit card" and "Prepaid card" are the 2023 renames of
# "Credit card or prepaid card"; they are the same product. "Debt or credit
# management" (a new 2023 product) is deliberately excluded.
target_products:
  - Credit card or prepaid card
  - Credit card
  - Prepaid card
  - Checking or savings account
  - Money transfer, virtual currency, or money service
  - Debt collection

# Complaints matching any of these are labelled 1 (fraud/scam-related).
positive:
  # Debt collection
  - product: Debt collection
    issue: Attempts to collect debt not owed
    sub_issue: Debt was result of identity theft
  # v2: a debt the consumer says is not theirs is treated like its sibling
  # "Debt was result of identity theft"; which box a consumer ticks between
  # the two is close to arbitrary.
  - product: Debt collection
    issue: Attempts to collect debt not owed
    sub_issue: Debt is not yours
  # v2: impersonating an attorney, police or a government official is a
  # hallmark of scam ("phantom debt") collectors.
  - product: Debt collection
    issue: False statements or representation
    sub_issue: Impersonated attorney, law enforcement, or government official

  # Money transfer
  - product: Money transfer, virtual currency, or money service
    issue: Fraud or scam
  # Bundles "other transaction problems" with unauthorized transactions;
  # kept positive (reviewed again in v2) because unauthorized transactions
  # are its core.
  - product: Money transfer, virtual currency, or money service
    issue: Unauthorized transactions or other transaction problem

  # Credit card or prepaid card (and its 2023 renames)
  - product: Credit card or prepaid card
    issue: Problem with a purchase shown on your statement
    sub_issue: Card was charged for something you did not purchase with the card
  - product: Credit card or prepaid card
    issue: Getting a credit card
    sub_issue: Card opened as result of identity theft or fraud
  - product: Credit card or prepaid card
    issue: Problem with a purchase or transfer
    sub_issue: Charged for a purchase or transfer you did not make with the card
  - product: Credit card
    issue: Problem with a purchase shown on your statement
    sub_issue: Card was charged for something you did not purchase with the card
  - product: Credit card
    issue: Getting a credit card
    sub_issue: Card opened without my consent or knowledge
  - product: Prepaid card
    issue: Problem with a purchase or transfer
    sub_issue: Charged for a purchase or transfer you did not make with the card

  # Checking or savings account
  - product: Checking or savings account
    issue: Problem with a lender or other company charging your account
    sub_issue: Transaction was not authorized
  - product: Checking or savings account
    issue: Opening an account
    sub_issue: Account opened as a result of fraud
  - product: Checking or savings account
    issue: Opening an account
    sub_issue: Account opened without my consent or knowledge

# Keyword candidates judged NOT to be fraud events (labelled 0). In v2 all
# former entries moved to `excluded`; the list is kept (empty) so the file
# format is unchanged.
reviewed_negative: []

# v2: complaints in these categories are REMOVED from the dataset before
# sampling: they are too ambiguous to call fraud or not fraud.
excluded:
  # The bank's handling of a purchase dispute: sometimes a disputed
  # unauthorized charge, mostly merchant quality, refunds and returns.
  - product: Credit card or prepaid card
    issue: Problem with a purchase shown on your statement
    sub_issue: Credit card company isn't resolving a dispute about a purchase on your statement
  - product: Credit card
    issue: Problem with a purchase shown on your statement
    sub_issue: Credit card company isn't resolving a dispute about a purchase on your statement
  - product: Credit card or prepaid card
    issue: Problem with a purchase or transfer
    sub_issue: Card company isn't resolving a dispute about a purchase or transfer
  - product: Prepaid card
    issue: Problem with a purchase or transfer
    sub_issue: Card company isn't resolving a dispute about a purchase or transfer
  # An unrequested card can be identity theft or an unsolicited offer.
  - product: Credit card or prepaid card
    issue: Getting a credit card
    sub_issue: Sent card you never applied for
  - product: Credit card
    issue: Getting a credit card
    sub_issue: Sent card you never applied for
  # Credit-report accuracy: can be identity theft, but also mixed files or
  # forgotten legitimate inquiries (formerly reviewed negatives).
  - issue: Incorrect information on your report
    sub_issue: Information belongs to someone else
  - issue: Improper use of your report
    sub_issue: Credit inquiries on your report that you don't recognize
  # "Lost" is not fraud but "stolen" is; the category does not separate them.
  - product: Money transfer, virtual currency, or money service
    issue: Lost or stolen check
  - product: Money transfer, virtual currency, or money service
    issue: Lost or stolen money order
  # Complaints about protection products or alerts themselves, not about a
  # fraud event (formerly reviewed negatives).
  - issue: Credit monitoring or identity theft protection services
  - issue: Problem with fraud alerts or security freezes
