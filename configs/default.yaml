# Pipeline configuration. Relative paths are resolved against the repo root.
# After changing a value, rerun the affected stages with --force.
# Research plan: docs/RESEARCH_PLAN.md (dataset facts in §2, splits in §4).

seed: 555

# Active dataset: yelpchi or amazon. Usually chosen with `run.py --dataset`.
dataset: null

# Active feature set (a rung of the model ladder; see feature_sets below).
# Stages from df_analyze_input on run for this feature set only and write to
# outputs/<dataset>/<feature_set>/; the graph block stages (neighbour_agg,
# gnn_embed) build only the blocks it uses. Change with --set feature_set=<name>.
feature_set: m1_own

gpu:
  # Stop if df-analyze's environment cannot see a CUDA GPU when df-analyze runs
  # catboost or gandalf (the only GPU users). Set to false to allow CPU
  # fallback on machines without an NVIDIA GPU.
  require: true

paths:
  raw_dir: data/raw/care_gnn       # downloaded .zip and .mat files
  processed_dir: data/processed    # + /<dataset>/
  outputs_dir: outputs             # + /<dataset>/

download:
  # The CARE-GNN repository (Dou et al., CIKM 2020; Apache-2.0) at a pinned
  # commit, never `master`, so the files cannot change under us.
  base_url: https://raw.githubusercontent.com/YingtongDou/CARE-GNN/a64ff7523e187a24251f7ca88435d2c9d8f7dcd9/data

# Per-dataset facts. `expected` counts are checked on load (plan §2); edge
# counts are undirected edges (half the .mat matrices' stored entries).
datasets:
  yelpchi:
    archive: YelpChi.zip
    archive_sha256: 3a31296b951e6c8158dddb783ff2c62709fa987d106bbe21e59f8e119053cec3
    mat: YelpChi.mat
    mat_sha256: fedb35a8fa539b27866244d3515a47a76b20080cdacb33112da3458fd2487b42
    # Short relation name -> .mat key. Nodes are reviews.
    relations:
      rur: net_rur    # same user
      rtr: net_rtr    # same product, same month (R-T-R)
      rsr: net_rsr    # same product, same star rating (R-S-R)
    # Nodes 0 .. unlabelled_prefix-1 are unlabelled (stored as label 0).
    unlabelled_prefix: 0
    # Split groups: connected components of this relation (= users), because
    # labels are user-level (plan §2, gotcha 2).
    groups: {rule: components, relation: rur}
    expected:
      n_nodes: 45954
      n_labelled: 45954
      n_positive: 6677
      n_features: 32
      n_edges: {rur: 49315, rtr: 573616, rsr: 3402743, homo: 3846979}
    # Untuned HistGradientBoosting on own features, grouped split (plan §2).
    # A Model A test PR-AUC more than report.sanity_margin below this is
    # treated as a likely pipeline bug.
    sanity_band: {pr_auc: 0.80, auroc: 0.94}
  amazon:
    archive: Amazon.zip
    archive_sha256: c1b7a1f8cd8621467d5121b690fef61a7d398e4f582232bb3e8a154424f7a5b9
    mat: Amazon.mat
    mat_sha256: 4b7e3f9cccc62b736792707393ccd74332a1a0592dba128ac6b2989bf1ee9d63
    # Nodes are users.
    relations:
      upu: net_upu    # reviewed at least one common product
      usu: net_usu    # gave the same star rating within one week
      uvu: net_uvu    # top-5% mutual review-text similarity
    # The first 3,305 users are unlabelled but stored as label 0. CARE-GNN
    # uses only range(3305, n); they are graph context only (plan §2, gotcha 1).
    unlabelled_prefix: 3305
    # Split groups: sets of labelled nodes with identical feature rows.
    groups: {rule: duplicate_features}
    expected:
      n_nodes: 11944
      n_labelled: 8639
      n_positive: 821
      n_features: 25
      n_edges: {upu: 175608, usu: 3566479, uvu: 1036737, homo: 4398392}
    sanity_band: {pr_auc: 0.91, auroc: 0.98}

# Feature sets = rungs of the model ladder: lists of feature blocks, each
# data/processed/<dataset>/features/<block>.parquet with columns <block>__*.
# One block per kind covers every relation (nbr__upu_mean_f00,
# gnnssl__upu_pc01), so the names are the same on YelpChi and Amazon.
feature_sets:
  m1_own: [own]
  m2_own_nbr: [own, nbr]          # + label-free neighbour means (Model 2)
  m5_own_gnnssl: [own, gnnssl]    # + self-supervised GNN embeddings (Model 5)
  # Pilot rungs (first demo, 2026-10-20): the same blocks under other names,
  # so the 100-trial m1_own run is never overwritten. All three are run with
  # --set "df_analyze.classifiers=[lgbm,lr,catboost]" --set df_analyze.htune_trials=10
  # on the same machine: a slower machine hits df-analyze's time limits
  # sooner, which would make the comparison unfair.
  pilot_m1_own: [own]
  pilot_m2_own_nbr: [own, nbr]
  pilot_m5_own_gnnssl: [own, gnnssl]
  # Issue #36, decided 2026-10-19: report every rung both ways. The _no36 sets
  # leave out the four possible label-shortcut features everywhere: own_no36 is
  # the own block without them, and nbr_no36 / gnnssl_no36 are built from that
  # reduced input (so the GNN never sees them either).
  m1_own_no36: [own_no36]
  m2_own_nbr_no36: [own_no36, nbr_no36]
  m5_own_gnnssl_no36: [own_no36, gnnssl_no36]
  pilot_m1_own_no36: [own_no36]
  pilot_m2_own_nbr_no36: [own_no36, nbr_no36]
  pilot_m5_own_gnnssl_no36: [own_no36, gnnssl_no36]
  # Phase 3 (docs/PHASE3_FEEDBACK_PLAN.md), pilot settings as above.
  # Task 3a: the untrained-GNN control (Model 5r), the gnnssl encoder with its
  # seeded initial weights and no training.
  pilot_m5r_own_gnnrand: [own, gnnrand]
  pilot_m5r_own_gnnrand_no36: [own_no36, gnnrand_no36]
  # Task 5: the four #36 features alone, with and without the graph (the GNN
  # and the neighbour means see only those four too).
  pilot_m1_own_only36: [own_only36]
  pilot_m2_own_nbr_only36: [own_only36, nbr_only36]
  pilot_m5_own_gnnssl_only36: [own_only36, gnnssl_only36]
  # Task 5, the other reading of "4 important features": the training-only
  # top 4 by permutation importance (outputs/amazon/probe/top_features.csv).
  pilot_m1_own_top4: [own_top4]
  pilot_m2_own_nbr_top4: [own_top4, nbr_top4]
  pilot_m5_own_gnnssl_top4: [own_top4, gnnssl_top4]

# Input variants: a block named <kind>_<variant> (own_no36, nbr_no36,
# gnnssl_no36) is built from the own features without the variant's columns:
# either the listed ones, or every column except the {keep: [...]} ones.
feature_variants:
  # Amazon only: univariate AUROC 0.86-0.88 on its training nodes; they may
  # encode the helpfulness votes the labels come from (issue #36).
  no36: [own__f13, own__f15, own__f18, own__f19]
  # Amazon only (phase 3, Task 5): only those four.
  only36: {keep: [own__f13, own__f15, own__f18, own__f19]}
  # Amazon only (phase 3, Task 5): the top 4 of the training-only permutation
  # ranking (scripts/top_features.py, 2026-10-23). It differs from only36:
  # f13 and f15 add little once f18 and f19 are known.
  top4: {keep: [own__f00, own__f18, own__f19, own__f23]}

neighbour_agg:
  # Model 2's `nbr` block. For each relation of the dataset (not homo): the
  # 1-hop mean of every own feature over the node's neighbours (0 for an
  # isolated node), and log1p(degree). On Amazon 3 x (25 + 1) = 78 columns.
  # It uses the features of every node, test and unlabelled ones included,
  # and never a label (AGENTS.md invariants 1 and 5). The 1-hop max and 2-hop
  # means are later ablations: they would push df-analyze past its
  # recommended number of features.
  statistics: [mean]
  log1p_degree: true

gnn_embed:
  # Model 5's `gnnssl` block: Deep Graph Infomax (PyG DeepGraphInfomax), one
  # model per relation, trained without labels. Needs the gnn extra
  # (`uv sync --extra gnn`).
  # Encoder: `layers` rounds of GCN-normalised propagation over a sparse
  # adjacency (with self-loops), each a linear map and a PReLU.
  layers: 2
  hidden: 64
  out_dim: 64
  # Corruption: the node feature rows are shuffled. Adam, early stopping on
  # the DGI loss. The loss covers non-test nodes (train and unlabelled); test
  # nodes take part in message passing only. The feature scaler that feeds
  # DGI and the PCA are fit on training nodes only (invariant 6).
  lr: 0.001
  max_epochs: 300
  patience: 20
  # PCA of each relation's 64-d embedding: 3 x 8 = 24 columns on Amazon.
  pca_components: 8
  # cpu (decided 2026-10-19): bit-identical embeddings for a given seed, and
  # under a minute on Amazon. CUDA's sparse products differ by ~1e-7 between
  # runs. auto: CUDA if torch can use it, else the CPU; or cuda.
  device: cpu
  # Fraction of U-S-U edges kept (about 7.1M directed; sampled once, seeded);
  # 1.0 keeps all. If CUDA runs out of memory, that relation is retried on the
  # CPU (logged in meta.json); lower this only if the CPU is too slow.
  usu_edge_fraction: 1.0

split:
  # StratifiedGroupKFold over the labelled nodes: `test_folds` of `n_folds`
  # folds form the test set (2 of 5 = 40%). The test set is frozen.
  n_folds: 5
  test_folds: 2
  # Grouped, stratified CV folds on the training set, shared by select_model
  # (and later by any out-of-fold feature).
  cv_folds: 5
  # Independently seeded grouped splits (split seed = seed + 1000 * repeat).
  # With n_repeats > 1, run.py runs the pipeline once per repeat and writes
  # Model A's mean ± SD across repeats to
  # outputs/<dataset>/<feature_set>/repeats_summary.md. Repeat 0 uses the
  # usual folders; repeat k uses data/processed/<dataset>_repeat<k>/ and
  # outputs/<dataset>_repeat<k>/. Each repeat is a full df-analyze run, so
  # 3 repeats take 3 times as long. Decided 2026-10-08: 1 for Model 1; 3 for
  # Amazon once Model 2 exists, so the compared rungs share the same splits.
  n_repeats: 1
  # The repeat to run; set it (--set split.repeat=2) to run one repeat only.
  repeat: 0

audit:
  # A feature whose univariate AUROC (oriented to be >= 0.5) on training nodes
  # reaches this is flagged as a possible label shortcut. Flagged features are
  # reported, never dropped automatically (an open decision; plan §10).
  shortcut_auroc: 0.85

df_analyze:
  dir: null                 # null: $DF_ANALYZE_DIR, else ../df-analyze
  # df-analyze commit this pipeline is tested against. Stages that call
  # df-analyze stop if the clone is at a different commit; set to null to
  # skip the check (e.g. when deliberately testing a newer df-analyze).
  commit: 199e5638620693c267dac715784f1fd0e33fa796
  # Python for df-analyze's environment. Its locked catboost 1.2.8 ships
  # wheels for 3.13 only, so an unpinned uv may pick 3.14 and fail to build.
  python: ">=3.13.11,<3.14"
  # dummy is added by df-analyze automatically. catboost and gandalf train on
  # the GPU when df-analyze sees CUDA; the others run on the CPU.
  # mlp is left out for now: df-analyze pins it to the CPU, where it used up its
  # 60-minute tuning limit on each of the 4 feature selections (~4 h per run).
  classifiers: [lgbm, lr, catboost, gandalf, rf, knn]
  htune_trials: 100
  # Balanced accuracy (0.5 cut-off), the same for every model. Not accuracy
  # (df-analyze's default): with 10-15% positives, always predicting "not
  # fraud" scores 0.85-0.90. Not auroc: df-analyze silently tunes most models
  # on balanced accuracy when asked for AUROC, but GANDALF on real AUROC, so
  # models would be tuned toward different goals. Model A is NOT chosen by
  # this score; see select_model below.
  htune_cls_metric: bal-acc
  # Passed through to df-analyze.py verbatim. The prediction-based feature
  # filter computes real AUROC from probabilities (the same features for every
  # model); df-analyze's default there is accuracy. Never add
  # --df-tests-method: it hits an enum bug in df-analyze 4.1.0.
  extra_args: ["--filter-pred-classify", "auroc"]

select_model:
  # Every tuned (model, feature selection) is refit on the saved grouped CV
  # folds of the training set (split.cv_folds) and scored from its
  # probabilities; Model A is the one with the highest mean PR-AUC (the
  # headline metric). The test set is not used.
  # Also score df-analyze's default hyperparameters (the before-tuning
  # baseline for the tuning gain). Never used to choose Model A.
  score_defaults: true
  # Watchdog: seconds one configuration (all folds) may take before the stage
  # prints stack traces and fails instead of hanging. The slowest (GANDALF)
  # took ~6 min on 18k rows on an RTX 4060; 0 disables it.
  config_timeout_s: 1800

report:
  # Decision threshold for F1, precision, recall and the confusion matrix,
  # chosen on Model A's out-of-fold TRAINING predictions, never on test.
  # max_f1: the threshold that maximises F1 there (decided 2026-10-08).
  # Test metrics are also reported at 0.5.
  threshold_rule: max_f1
  # Bootstrap 95% intervals for Model A's test PR-AUC and AUROC, resampling
  # whole split groups (users / duplicate sets).
  bootstrap_resamples: 1000
  # Warn when Model A's test PR-AUC is this far below the dataset's sanity band.
  sanity_margin: 0.05

web_report:
  # outputs/<dataset>/<feature_set>/report/index.html
  n_samples: 25        # test nodes per confidence card (most / least confident)
  n_top_features: 5    # features shown per node, largest values first
