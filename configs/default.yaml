# Pipeline configuration. Relative paths are resolved against the repo root.
# After changing a value, rerun the affected stages with --force.

seed: 555

gpu:
  # Stop if df-analyze's environment cannot see a CUDA GPU when a GPU step runs
  # (the embedding runner, and df-analyze with catboost/gandalf). Set to false
  # to allow CPU fallback on machines without an NVIDIA GPU.
  require: true

paths:
  raw_dir: data/raw
  interim_dir: data/interim
  processed_dir: data/processed
  outputs_dir: outputs
  categories_file: configs/categories.yaml  # reviewed label rule and product filter

load:
  # Extracted by ./download_dataset.sh into data/raw/<name>/
  archives:
    - CCDB_Export_2_May_2018_through_April_2021
    - CCDB_Export_3_May_2021_through_October_2022
    - CCDB_Export_4_November_2022_through_August_2023
  date_min: "2018-05-01"  # fixed design decision (see README)
  date_max: "2023-08-31"
  chunksize: 200000

dedup:
  shingle_words: 5          # word n-gram size for MinHash
  jaccard_threshold: 0.85   # pairs at or above this are near-duplicates
  num_perm: 128

sample:
  n_complaints: 30000       # final sample, natural fraud rate
  # Near-duplicates are removed from a stratified pool of
  # n_complaints * pool_factor complaints before the final sample is drawn.
  pool_factor: 1.5

split:
  test_size: 0.4            # stratified by label; the test set is frozen

embed:
  # "gpu": scripts/dfa/embed_on_device.py, df-embed's own code run on the GPU
  #        (CPU if no GPU and gpu.require is false). "df-embed": df-embed.py (CPU only).
  runner: gpu
  batch_size: 16            # df-embed.py default is 2 (slow)
  # Rows also embedded with df-embed's unmodified CPU path and compared (GPU only).
  verify_rows: 64

pca:
  n_components: 30

features:
  # Categorical levels with fewer training complaints than this (and levels
  # seen only in test) are merged into one level, using training counts only.
  # 20 matches df-analyze's own threshold, so df-analyze (which counts over
  # train+test together) has nothing left to merge.
  min_level_count: 20

df_analyze:
  dir: null                 # null: $DF_ANALYZE_DIR, else ../df-analyze
  # df-analyze commit this pipeline is tested against. Stages that call
  # df-analyze stop if the clone is at a different commit; set to null to
  # skip the check (e.g. when deliberately testing a newer df-analyze).
  commit: 199e5638620693c267dac715784f1fd0e33fa796
  # Python for df-analyze's environment. Its locked catboost 1.2.8 ships
  # wheels for 3.13 only, so an unpinned uv may pick 3.14 and fail to build.
  python: ">=3.13.11,<3.14"
  # dummy is added by df-analyze automatically. catboost and gandalf train on
  # the GPU when df-analyze sees CUDA; the others run on the CPU.
  # mlp is left out for now: df-analyze pins it to the CPU, where it uses up its
  # 60-minute tuning limit on each of the 4 feature sets (~4 h per run).
  classifiers: [lgbm, lr, catboost, gandalf, rf, knn]
  htune_trials: 100
  # Balanced accuracy (0.5 cut-off), the same for every model. Not accuracy
  # (df-analyze's default): with ~30% positives (label rule v2), always
  # predicting "not fraud" scores ~0.70. Not auroc: df-analyze silently tunes most models on balanced
  # accuracy when asked for AUROC, but GANDALF on real AUROC, so models would
  # be tuned toward different goals. Model A is NOT chosen by this score; see
  # select_model below.
  htune_cls_metric: bal-acc
  # Passed through to df-analyze.py verbatim. The prediction-based feature
  # filter computes real AUROC from probabilities (the same features for every
  # model); df-analyze's default there is accuracy.
  extra_args: ["--filter-pred-classify", "auroc"]

select_model:
  # Every tuned (model, feature set) is refit on the same stratified folds of
  # the training set and scored from its probabilities; Model A is the one
  # with the highest mean PR-AUC (the headline metric). The test set is not used.
  n_folds: 5
  # Also score df-analyze's default hyperparameters (the before-tuning
  # baseline for the tuning gain). Never used to choose Model A.
  score_defaults: true
  # Watchdog: seconds one configuration (all folds) may take before the stage
  # prints stack traces and fails instead of hanging. The slowest (GANDALF)
  # took ~6 min on an RTX 4060; 0 disables it.
  config_timeout_s: 1800

web_report:
  # outputs/report/index.html. Contains narratives: never commit or post it.
  n_samples: 25        # complaints per confidence card (most / least confident)
  excerpt_chars: 600   # narrative characters shown per complaint
